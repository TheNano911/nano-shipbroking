function draw(){nav.innerHTML=views.map((v,i)=>'<button data-act="view" data-id="'+v+'" class="'+(view===v?'on':'')+'">'+ic(i)+h(v)+'</button>').join('');$('#crumb').textContent=view;
let list=db.records,cargos=list.filter(r=>r.kind==='Cargo'),ships=list.filter(r=>r.kind==='Open tonnage'),tasks=list.filter(r=>(r.next||r.due)&&!closed(r)&&!stale(r)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')),html='';
if(view==='Overview'){html='<section class="hero">'+chart()+'<div style="z-index:1"><div class="eyebrow">Broker workspace</div><h1>Chartering desk</h1><p>Ali Nano · Independent Shipbroker</p></div></section><div class="metrics">'+[['Cargo',cargos.length,1],['Open tonnage',ships.length,2],['Follow-ups',tasks.length,6],['Fixtures',list.filter(x=>x.status==='fixed').length,7]].map(([v,n,i])=>'<button class="metric" data-act="view" data-id="'+v+'">'+ic(i)+h(v)+'<b>'+n+'</b></button>').join('')+'</div>'+head('Opportunity register',btn('+ Cargo','new','Cargo','primary')+btn('+ Open tonnage','new','Open tonnage'))+'<div class="cols"><div class="panel flush">'+recordTable(list.slice(0,8))+'</div><div class="panel"><h3>Next actions</h3>'+tasks.slice(0,4).map(r=>'<div class="queue">'+btn(r.name,'detail',r.id)+'<p>'+h(r.next)+'</p><small>'+h(r.due?fmt(r.due):'No date set')+'</small></div>').join('')+btn('All follow-ups','view','Follow-ups')+'</div></div><div class="actions">'+btn('Export encrypted backup','export')+'<label class="file">Restore backup<input id="restore" type="file" accept=".json"></label>'+btn('Lock workspace','lock')+'</div>'}
if(['Cargo','Open tonnage','Fixtures','Follow-ups'].includes(view)){const rs=view==='Fixtures'?list.filter(r=>r.status==='fixed'):view==='Follow-ups'?tasks:list.filter(r=>r.kind===view);html=head(view,['Cargo','Open tonnage'].includes(view)?btn('+ '+view,'new',view,'primary'):'')+'<section class="panel">'+filterBar()+(view==='Follow-ups'?table(['Opportunity','Next action','Due','Last contact'],filtered(rs).map(r=>[btn(r.name,'edit',r.id,'link'),h(r.next),h(r.due?fmt(r.due):'Unscheduled'),fmt(r.last)])):recordTable(filtered(rs)))+'</section>'}
if(view==='Contacts'){html=head('Contact directory',btn('+ Contact','contact','','primary'))+'<div class="panel flush">'+table(['Contact','Role','Trading notes','Last contact'],db.contacts.map(c=>[btn(c.name,'contact',c.id,'link'),h(c.role),h(c.notes),fmt(c.last)]))+'</div>'}
if(view==='Outreach'){html=head('Outreach log',btn('Edit templates','templates')+btn('+ Message','draft','','primary'))+'<div class="panel flush">'+messageTable(db.messages)+'</div>'}
if(view==='Vessel matching'){let c=cargos.find(x=>x.id===selected)||cargos[0];html=head('Vessel matching')+'<div class="panel">'+field('matchCargo','Cargo requirement',c?.id,cargos.map(r=>[r.id,r.name+' · '+route(r)]))+'</div>';if(c){const ranked=ships.map(v=>compare(c,v)).sort((a,b)=>a.rejects-b.rejects||b.passes-a.passes);html+=ranked.map(({v,rows,rejects,passes},i)=>'<section class="panel"><div class="sectionhead"><h3>'+h(v.name)+'</h3>'+pill(rejects?'Rejected':'Review')+'</div><p>'+h(route(v))+' · '+(rejects?rows.filter(x=>x[3]==='Reject').map(x=>x[0]).join(', ')+' outside requirements':passes+' confirmed criteria; verify remaining requirements')+'</p><details '+(i===0?'open':'')+'><summary>Compare particulars</summary>'+table(['Criterion','Cargo requirement','Vessel particulars','Result'],rows.map(x=>[...x.slice(0,3).map(h),pill(x[3])]))+'</details>'+(!rejects?btn('Record reviewed match','pair',v.id):'')+'</section>').join('')||'<p>Add an open vessel to compare.</p>'}}
app.innerHTML=(!list.length&&view==='Overview'?'<div class="note"><b>Set up your desk</b> · Restore your private seed file to load your existing opportunities. <label class="file">Import initial records<input id="seedImport" type="file" accept=".json"></label></div>':'')+html}
async function save(change){if(busy)return;busy=true;let old=structuredClone(db);try{if(localStorage.getItem(storage)!==previous)throw Error('Another tab changed this workspace. Reload before saving.');change();let encrypted=JSON.stringify(await seal());if(localStorage.getItem(storage)!==previous)throw Error('Workspace changed. Reload before saving.');localStorage.setItem(storage,encrypted);previous=encrypted;modal.close();draw();toast('Saved on this device.')}catch(e){db=old;alert(e.message)}finally{busy=false}}
function contact(c={}){form('Contact details','<div class="formgrid">'+[['name','Contact name'],['role','Role / company'],['phone','WhatsApp number'],['email','Email address'],['last','Last contact'],['notes','Trading notes']].map(([k,l])=>field(k,l,c[k],null,k==='last'?'date':k==='notes'?'area':'text')).join('')+'</div><h3>Prior outreach</h3>'+messageTable(db.messages.filter(m=>m.contact===c.id)),'contact',c.id)}
document.addEventListener('click',async e=>{let b=e.target.closest('[data-act]');if(!b||!db)return;e.preventDefault();let a=b.dataset.act,id=b.dataset.id;
if(a==='view'||a==='match'){modal.close();view=a==='match'?'Vessel matching':id;if(a==='match')selected=id;filters={};draw();window.scrollTo(0,0)}
if(a==='close')modal.close();if(a==='new')edit({kind:id,status:'new',confidence:'Unknown',privacy:'Private'});if(a==='edit')edit(get(id));if(a==='detail')detail(id);if(a==='draft')message({record:id||db.records[0]?.id});if(a==='msg')message(db.messages.find(m=>m.id===id));if(a==='apply')applyTemplate();if(a==='contact')contact(person(id));if(a==='clear'){filters={};draw()}
if(a==='templates')form('Reusable templates','<p class="sub">Available fields: {contact}, {name}, {route}, {quantity}, {window}</p><div class="formgrid">'+Object.keys(baseTemplates).map((t,i)=>field('t'+i,t,db.templates[t]??baseTemplates[t],null,'area')).join('')+'</div>','templates');
if(a==='pair'){const c=get($('[name=matchCargo]').value);edit({...c,status:'matched',link:id});}
if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(await seal())],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='nano-brokerdesk-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
if(a==='lock'){sessionStorage.removeItem('nano.session');location.reload()}
});
document.addEventListener('change',async e=>{if(e.target.name==='matchCargo'){selected=e.target.value;draw()}if(e.target.name==='record'&&modal.open)restriction();if(['restore','seedImport'].includes(e.target.id)){try{let restored=await unseal(JSON.parse(await e.target.files[0].text()));if(!Array.isArray(restored.records)||!Array.isArray(restored.messages)||!Array.isArray(restored.contacts)||!restored.templates)throw Error();if(!db.records.length||confirm('Replace this device’s workspace with the selected backup?'))await save(()=>{db=restored});e.target.value=''}catch{alert('Unable to restore. Select a backup encrypted with this workspace key.')}}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f)),mode=f.dataset.mode,id=f.dataset.id;if(f.id==='unlock'){await unlock(v.key.trim());if(!db)toast('Access key could not open this workspace.');return}if(!db)return;if(f.id==='filterform'){filters=v;draw();return}
if(mode==='record'&&v.start&&v.end&&v.start>v.end)return alert('End date must follow the start date.');if(mode==='record'&&v.minsize&&v.maxsize&&+v.minsize>+v.maxsize)return alert('Maximum DWT must meet the minimum.');
if(mode==='message'&&(!v.body.trim()||(v.stage!=='draft'&&(!v.contact||!v.date))||(v.stage==='replied'&&!v.reply.trim())))return alert('Enter message text, and for logged exchanges provide a recipient, date and any received reply.');
await save(()=>{if(mode==='templates'){Object.keys(baseTemplates).forEach((t,i)=>db.templates[t]=v['t'+i]);return}let arr=mode==='record'?db.records:mode==='contact'?db.contacts:db.messages;let existing=arr.find(x=>x.id===id);if(existing)Object.assign(existing,v);else arr.unshift({...v,id:uid()});if(mode==='message'&&v.stage!=='draft'){for(const obj of [person(v.contact),get(v.record)])if(obj&&(!obj.last||v.date>obj.last))obj.last=v.date;const r=get(v.record);if(v.stage==='sent'&&['new','unverified','active'].includes(state(r)))r.status='awaiting reply'}})});
unlock(location.hash.slice(1)||sessionStorage.getItem('nano.session')||'');
</script></body></html>
